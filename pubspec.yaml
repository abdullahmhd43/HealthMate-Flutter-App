name: healthmate
description: HealthMate - Your Daily Health Companion. A personal health and wellness tracker (CI6330 Coursework 1).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  path: ^1.9.0
  provider: ^6.1.2
  intl: ^0.20.2
  fl_chart: ^0.69.2
  shared_preferences: ^2.3.4
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  pedometer: ^4.1.0
  permission_handler: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# App icon. Generate the Android / iOS launcher icons once (after
# `flutter create ...`) with:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: assets/images/app_icon_background.png
  adaptive_icon_foreground: assets/images/app_icon_foreground.png
